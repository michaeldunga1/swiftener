<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3eee4" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!--SEO_HEAD-->
    <!--SITE_CONFIG-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>
    <div class="ambient" aria-hidden="true"></div>
    <header class="site-header">
      <div class="container header-inner">
        <a href="/" class="brand" data-link>Swiftener</a>
        <button
          type="button"
          class="nav-toggle"
          id="nav-toggle"
          aria-expanded="false"
          aria-controls="header-panel"
          aria-label="Open menu"
        >
          <span class="nav-toggle-bars" aria-hidden="true"></span>
        </button>
        <div class="header-panel" id="header-panel">
          <nav class="nav-main" id="nav-main" aria-label="Primary"></nav>
          <div class="header-actions" id="header-actions"></div>
        </div>
      </div>
    </header>
    <main id="app" class="container main" tabindex="-1"></main>
    <!--PRERENDER-->
    <footer class="site-footer">
      <div class="container footer-shell">
        <p class="footer-tagline">Clear, practical How-to guides on useful IT topics for beginners and intermediate readers.</p>
        <div class="footer-columns">
          <nav class="footer-nav" id="footer-nav" aria-label="Site">
            <a href="/" data-link>Home</a>
            <a href="/#search" data-link>Search</a>
            <a href="/newsletter" data-link>Newsletter</a>
            <a href="/#categories" data-link>Categories</a>
          </nav>
          <nav class="footer-nav footer-nav-legal" aria-label="About and legal">
            <a href="/about" data-link>About</a>
            <a href="/contact" data-link>Contact</a>
            <a href="/privacy" data-link>Privacy Policy</a>
            <a href="/terms" data-link>Terms of Use</a>
          </nav>
        </div>
        <p class="footer-copy">© <span id="footer-year">2026</span> Swiftener. Practical How-to guides for learners and practitioners.</p>
      </div>
    </footer>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
